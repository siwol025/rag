services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie   # pgvector 포함(TO-012). tests/conftest.py와 같은 이미지
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"     # 로컬 uv run, psql 확인용
    volumes:
      - postgres_data:/var/lib/postgresql   # 18부터 이 경로(…/data 아님)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.3-alpine
    command: ["redis-server", "--appendonly", "yes"]   # 재시작해도 대기 중인 작업이 남게(AOF)
    ports:
      - "127.0.0.1:6380:6379"     # 로컬 uv run, redis-cli 확인용(호스트 6379는 다른 프로젝트가 사용 중)
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "slack_rag.worker"]
    env_file: .env                   # GEMINI_API_KEY, LLM_LIGHT_MODEL도 여기서(3.12)
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api:
        condition: service_started   # 스키마·체크포인트 테이블은 api가 시작하며 적용(워커가 먼저 뜨면 실패 후 재시작)
      redis:
        condition: service_healthy
    restart: unless-stopped          # Redis가 끊기면 워커가 종료됨 → 다시 떠서 대기 작업을 보정(02-queue-worker-plan 3.6)
    stop_grace_period: 70s           # SIGTERM 뒤 실행 중 작업을 최대 60초 기다림(worker.SHUTDOWN_WAIT_S, 3.6)

  indexer:
    build: .
    command: ["python", "-m", "slack_rag.indexer", "--loop"]   # 시작 때 1회, 이후 300초마다(TO-014)
    init: true                       # 작은 init이 PID 1: docker compose stop의 SIGTERM이 파이썬에 바로 전달됨(04-rag-document-search-plan 3.6)
    env_file: .env                   # GEMINI_API_KEY, EMBEDDING_MODEL(Settings 필수 키도 여기서)
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ./sample_docs:/app/sample_docs:ro   # 색인 폴더(샘플 전용, 읽기 전용, TO-013). 고치면 최대 5분 뒤 반영
    depends_on:
      api:
        condition: service_started   # 확장·표는 api가 시작하며 적용(먼저 돌면 그 회차만 실패 로그)
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:2.47.4
    environment:
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}         # 터널 주소. Slack Trigger의 Production URL에 쓰임
      N8N_PROXY_HOPS: "1"                     # 터널(프록시) 1단 뒤에 있음
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "127.0.0.1:5678:5678"     # 터널이 이 포트로 연결
    volumes:
      - n8n_data:/home/node/.n8n  # 워크플로, 자격 증명, 암호화 키(SQLite)
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  n8n_data:
