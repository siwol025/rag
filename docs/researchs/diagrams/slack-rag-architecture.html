<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Slack 장애 자동 분석 파이프라인</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif:ital@0;1&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@400&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Serif+TC:wght@400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;   /* white-smoke */
      --color-ink:     #2d3142;   /* jet-black */
      --color-muted:   #4f5d75;   /* blue-slate */
      --color-accent:  #bf4520;   /* burnt-tangerine */
      --font-sans:     'Geist', 'Noto Sans KR', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', 'Noto Serif KR', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Simple</p>
    <h1>Slack 장애 자동 분석 파이프라인</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="slack-rag-architecture-title slack-rag-architecture-desc">

        <desc id="slack-rag-architecture-desc">Slack 이벤트가 n8n과 FastAPI를 거쳐 메시지 큐에 쌓이고, LangGraph 기반 AI Worker가 Redis 캐시, RAG 검색, LLM, 회귀 테스트를 거쳐 결과와 승인 요청을 Slack으로 돌려주는 구조를 보여줍니다.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>

        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ Arrows first (behind boxes) ============ -->

        <!-- Row 1 ingress: Slack → n8n → FastAPI → Queue (y=112) -->
        <line x1="160" y1="112" x2="224" y2="112" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="336" y1="112" x2="400" y2="112" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <line x1="552" y1="112" x2="616" y2="112" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Queue bottom → Worker top (straight drop, x=680) -->
        <line x1="680" y1="144" x2="680" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- Worker top (x=616) → Slack bottom (x=100): reply lane at y=184 -->
        <path d="M 616,232 V 192 Q 616,184 608,184 H 108 Q 100,184 100,176 V 144"
              fill="none" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>

        <!-- Worker left → Redis right (optional cache lookup) -->
        <line x1="552" y1="268" x2="488" y2="268" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Worker bottom fan: ports x=600 / 648 / 696 -->

        <line x1="648" y1="304" x2="648" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 696,304 V 336 Q 696,344 704,344 H 816 Q 824,344 824,352 V 392"
              fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

              fill="none" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>

        <text x="192" y="101" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">EVENT</text>

        <rect x="340" y="92" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="368" y="101" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">HTTP POST</text>

        <rect x="562" y="92" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="584" y="101" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">ENQUEUE</text>

        <rect x="688" y="182" width="44" height="12" rx="2" fill="#f5f5f5"/>
        <text x="710" y="191" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">CONSUME</text>

        <rect x="302" y="162" width="112" height="16" rx="2" fill="#f5f5f5"/>
        <text x="358" y="174" fill="#2e5aa8" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">결과 · 승인 요청</text>

        <text x="804" y="258" fill="#bf4520" font-size="12" font-weight="500" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">실패 → 재수정</text>

        <text x="680" y="116" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', 'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">메시지 큐</text>

        <text x="648" y="444" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">light / heavy routing</text>
